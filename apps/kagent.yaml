apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent
    targetRevision: "0.7.23"
    helm:
      values: |
        ## Controller
        controller:
          nodeSelector:
            node-role.kubernetes.io/monitoring: ""
          tolerations:
            - key: node-role.kubernetes.io/monitoring
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi

        ## UI
        ui:
          nodeSelector:
            node-role.kubernetes.io/monitoring: ""
          tolerations:
            - key: node-role.kubernetes.io/monitoring
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi

        ## Disable all built-in agents (we deploy custom ones via agents/)
        agents:
          argo-rollouts-agent:
            enabled: false
          cilium-debug-agent:
            enabled: false
          cilium-manager-agent:
            enabled: false
          cilium-policy-agent:
            enabled: false
          helm-agent:
            enabled: false
          istio-agent:
            enabled: false
          k8s-agent:
            enabled: false
          kgateway-agent:
            enabled: false
          observability-agent:
            enabled: false
          promql-agent:
            enabled: false

        ## Tools server (k8s, prometheus, helm tools)
        kagent-tools:
          enabled: true
          nameOverride: "tools"
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          tools:
            loglevel: "debug"
            enabledTools:
              - k8s
              - prometheus
            metrics:
              port: 8085

        ## Database
        database:
          type: sqlite
          sqlite:
            databaseName: kagent.db

        ## Default LLM provider — Bedrock for all agents
        providers:
          default: bedrock
          bedrock:
            provider: Bedrock
            model: eu.anthropic.claude-haiku-4-5-20251001-v1:0
            apiKeySecretRef: aws-credentials
            config:
              region: eu-west-3

        ## Grafana MCP server — override default URL (grafana.kagent:3000)
        ## /grafana/api car Grafana est servi en sous-chemin (serve_from_sub_path)
        ## Token lu depuis le Secret grafana-mcp-token (clé GRAFANA_SERVICE_ACCOUNT_TOKEN)
        ## → voir README "Secret Grafana MCP" pour le créer
        grafana-mcp:
          grafana:
            url: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80/grafana/api"
            secretRef: "grafana-mcp-token"
          ## mcp-grafana valide le header Host (protection anti-DNS-rebinding).
          ## Défaut = loopback uniquement → le controller (Host kagent-grafana-mcp.kagent:8000)
          ## reçoit un 403 Forbidden silencieux. On autorise le Host du Service (ClusterIP interne).
          args:
            - --allowed-hosts
            - "kagent-grafana-mcp.kagent:8000"

        tools:
          grafana-mcp:
            enabled: true
          querydoc:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
