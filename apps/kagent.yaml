apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent
    targetRevision: "0.7.23"
    helm:
      values: |
        ## Controller
        controller:
          nodeSelector:
            node-role.kubernetes.io/monitoring: ""
          tolerations:
            - key: node-role.kubernetes.io/monitoring
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi

        ## UI
        ui:
          nodeSelector:
            node-role.kubernetes.io/monitoring: ""
          tolerations:
            - key: node-role.kubernetes.io/monitoring
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi

        ## Disable all built-in agents (we deploy custom ones via agents/)
        agents:
          argo-rollouts-agent:
            enabled: false
          cilium-debug-agent:
            enabled: false
          cilium-manager-agent:
            enabled: false
          cilium-policy-agent:
            enabled: false
          helm-agent:
            enabled: false
          istio-agent:
            enabled: false
          k8s-agent:
            enabled: true
          kgateway-agent:
            enabled: false
          observability-agent:
            enabled: true
          promql-agent:
            enabled: true

        ## Tools server (k8s, prometheus, helm tools)
        kagent-tools:
          enabled: true
          nameOverride: "tools"
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          tools:
            loglevel: "debug"
            enabledTools:
              - k8s
              - prometheus
            metrics:
              port: 8085

        ## Database
        database:
          type: sqlite
          sqlite:
            databaseName: kagent.db

        ## Default LLM provider — Bedrock for all agents
        provider: bedrock
        bedrock:
          model: eu.anthropic.claude-haiku-4-5-20251001-v1:0
          apiKeySecret: aws-credentials
          region: eu-west-3

        tools:
          grafana-mcp:
            enabled: false
          querydoc:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
