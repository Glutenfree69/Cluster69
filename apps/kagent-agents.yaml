apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-agents
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Glutenfree69/Cluster69
    targetRevision: main
    path: agents
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
