apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.6.2"
    helm:
      values: |
        alloy:
          mounts:
            varlog: true
          configMap:
            content: |
              // Discover pod log files on each node
              // Path format: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<N>.log
              local.file_match "pods" {
                path_targets = [{ __path__ = "/var/log/pods/*/*/*.log" }]
              }

              // Extract namespace, pod, container from file path
              discovery.relabel "pods" {
                targets = local.file_match.pods.targets

                rule {
                  source_labels = ["__path__"]
                  regex         = "/var/log/pods/([^_]+)_([^_]+)_[^/]+/([^/]+)/.*\\.log"
                  target_label  = "namespace"
                  replacement   = "$1"
                }
                rule {
                  source_labels = ["__path__"]
                  regex         = "/var/log/pods/([^_]+)_([^_]+)_[^/]+/([^/]+)/.*\\.log"
                  target_label  = "pod"
                  replacement   = "$2"
                }
                rule {
                  source_labels = ["__path__"]
                  regex         = "/var/log/pods/([^_]+)_([^_]+)_[^/]+/([^/]+)/.*\\.log"
                  target_label  = "container"
                  replacement   = "$3"
                }
              }

              // Read log files and forward to Loki
              loki.source.file "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }

              // Send logs to Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
                }
              }

        controller:
          type: daemonset

        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: node-role.kubernetes.io/monitoring
            operator: Exists
            effect: NoSchedule

        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
