---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agentpipelines.aiops.cluster69.io
spec:
  group: aiops.cluster69.io
  names:
    kind: AgentPipeline
    listKind: AgentPipelineList
    plural: agentpipelines
    singular: agentpipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentStage
      name: Stage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentPipeline orchestrates kagent AI agents through sequential stages.
          It watches the pipeline CR, invokes agents via the A2A protocol,
          and passes outputs between stages using ConfigMaps.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired pipeline configuration.
            properties:
              retryPolicy:
                description: |-
                  retryPolicy defines the default retry behavior for failed stages.
                  Individual stages can override this.
                properties:
                  backoff:
                    default: 30s
                    description: backoff is the delay between retry attempts (e.g.
                      "30s", "1m").
                    type: string
                  maxRetries:
                    default: 0
                    description: maxRetries is the maximum number of retry attempts.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              stages:
                description: stages is the ordered list of agent stages to execute.
                items:
                  description: StageSpec defines a single stage in the pipeline.
                  properties:
                    agentRef:
                      description: agentRef references the kagent Agent CR to invoke
                        for this stage.
                      properties:
                        name:
                          description: name is the name of the kagent Agent CR.
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            namespace is the namespace of the kagent Agent CR.
                            Defaults to the pipeline's namespace if not specified.
                          type: string
                      required:
                      - name
                      type: object
                    config:
                      description: config holds optional stage-specific configuration
                        (e.g. autoMerge, targetRepo).
                      properties:
                        autoMerge:
                          description: autoMerge indicates whether gitops PRs should
                            be auto-merged.
                          type: string
                        targetRepo:
                          description: targetRepo is the GitHub repository for gitops
                            operations.
                          type: string
                      type: object
                    dependsOn:
                      description: |-
                        dependsOn lists stage names that must complete before this stage can start.
                        If empty, the stage depends on the previous stage in the list (implicit ordering).
                      items:
                        type: string
                      type: array
                    inputs:
                      additionalProperties:
                        type: string
                      description: inputs provides static key-value pairs available
                        in prompt templates via {{.Inputs}}.
                      type: object
                    name:
                      description: name is the unique identifier for this stage within
                        the pipeline.
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    prompt:
                      description: |-
                        prompt is a Go template string sent to the agent. Supports {{.PreviousOutput}},
                        {{.StageOutput "name"}}, and {{.Inputs}} for inter-stage data passing.
                      type: string
                    retryPolicy:
                      description: retryPolicy overrides the pipeline-level retry
                        policy for this stage.
                      properties:
                        backoff:
                          default: 30s
                          description: backoff is the delay between retry attempts
                            (e.g. "30s", "1m").
                          type: string
                        maxRetries:
                          default: 0
                          description: maxRetries is the maximum number of retry attempts.
                          format: int32
                          minimum: 0
                          type: integer
                      type: object
                    timeout:
                      default: 5m
                      description: timeout is the maximum duration to wait for the
                        agent to complete.
                      type: string
                  required:
                  - agentRef
                  - name
                  type: object
                minItems: 1
                type: array
              trigger:
                description: trigger defines how the pipeline is initiated.
                properties:
                  alertmanager:
                    description: |-
                      alertmanager contains configuration for the Alertmanager webhook trigger.
                      Only used when type is "alertmanager".
                    properties:
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels filters incoming alerts by label
                          selectors.
                        type: object
                      webhookPort:
                        default: 8080
                        description: webhookPort is the port the webhook server listens
                          on.
                        format: int32
                        type: integer
                    type: object
                  type:
                    default: manual
                    description: type specifies the trigger mechanism. Only "manual"
                      is supported in v1alpha1.
                    enum:
                    - manual
                    - alertmanager
                    - event
                    type: string
                type: object
            required:
            - stages
            type: object
          status:
            description: status reflects the observed state of the pipeline execution.
            properties:
              completedAt:
                description: completedAt is the timestamp when the pipeline finished.
                format: date-time
                type: string
              conditions:
                description: conditions represent the latest available observations
                  of the pipeline's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentStage:
                description: currentStage is the name of the stage currently being
                  executed.
                type: string
              phase:
                description: phase is the overall pipeline lifecycle phase.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              stages:
                description: stages contains the status of each stage in the pipeline.
                items:
                  description: StageStatus captures the observed state of a single
                    stage execution.
                  properties:
                    completedAt:
                      description: completedAt is the timestamp when this stage finished
                        (success or failure).
                      format: date-time
                      type: string
                    error:
                      description: error contains the error message if the stage failed.
                      type: string
                    name:
                      description: name is the stage identifier matching StageSpec.Name.
                      type: string
                    output:
                      description: |-
                        output is the truncated agent response (last 1024 characters).
                        Full output is stored in the ConfigMap referenced by outputRef.
                      type: string
                    outputRef:
                      description: outputRef is the name of the ConfigMap containing
                        the full stage output.
                      type: string
                    phase:
                      description: phase is the current lifecycle phase of this stage.
                      enum:
                      - Pending
                      - Running
                      - Completed
                      - Failed
                      - Skipped
                      type: string
                    retryCount:
                      description: retryCount is the number of retries attempted so
                        far.
                      format: int32
                      type: integer
                    startedAt:
                      description: startedAt is the timestamp when this stage began
                        execution.
                      format: date-time
                      type: string
                    taskID:
                      description: taskID is the kagent A2A task identifier for tracking.
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              startedAt:
                description: startedAt is the timestamp when the pipeline began execution.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
