# This rule is not used by the project agentpipeline-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over aiops.cluster69.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentpipeline-operator
    app.kubernetes.io/managed-by: kustomize
  name: agentpipeline-admin-role
rules:
- apiGroups:
  - aiops.cluster69.io
  resources:
  - agentpipelines
  verbs:
  - '*'
- apiGroups:
  - aiops.cluster69.io
  resources:
  - agentpipelines/status
  verbs:
  - get
