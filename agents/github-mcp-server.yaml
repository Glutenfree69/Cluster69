apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: github-mcp-server
  namespace: kagent
spec:
  description: "GitHub MCP Server — acces au repo Glutenfree69/Cluster69"
  protocol: STREAMABLE_HTTP
  url: https://api.githubcopilot.com/mcp/
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        valueRef: github-token
        key: GITHUB_TOKEN
