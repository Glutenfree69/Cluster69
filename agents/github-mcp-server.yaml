apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: github-mcp-server
  namespace: kagent
spec:
  deployment:
    image: ghcr.io/github/github-mcp-server:latest
    port: 3000
    cmd: github-mcp-server
    args:
      - --toolsets=repos,pulls
    env:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-token
            key: GITHUB_TOKEN
  transportType: stdio
  stdioTransport: {}
