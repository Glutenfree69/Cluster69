apiVersion: kagent.dev/v1alpha1
kind: ToolServer
metadata:
  name: github-mcp-server
  namespace: kagent
spec:
  description: "GitHub MCP Server — acces au repo Glutenfree69/Cluster69"
  config:
    stdio:
      command: github-mcp-server
      args:
        - --toolsets=repos,pulls
      envFrom:
        - name: GITHUB_PERSONAL_ACCESS_TOKEN
          valueFrom:
            type: Secret
            valueRef: github-token
            key: GITHUB_TOKEN
